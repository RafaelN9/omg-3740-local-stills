name: decode-stills
on:
  push:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNGs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in *.png.b64; do
            base64 -d "$f" > "${f%.b64}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.png
          if git diff --cached --quiet; then
            echo none
          else
            git commit -m "Decode stills to PNG"
            git push
          fi
